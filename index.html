<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiori Silvestri</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2B34">
  <link rel="icon" href="icon-192.png">
</head>

<body>

  <!-- Splash -->

<div id="splash">

  <div class="splash-content">

    <img
      src="icon-192.png"
      alt="Fiori Silvestri"
      class="logo">

  </div>

  <img
    src="flowers-bottom.png"
    alt=""
    class="splash-decoration">

</div>

  <!-- App -->

  <div id="app" class="hidden"></div>

  <!-- Затемнение -->

  <div id="overlay"></div>

  <!-- Боковое меню -->

  <div id="drawer">

    <div class="drawer-content">

      <a href="#" data-page="sale">
        Продажа
      </a>

      <a href="#" data-page="orders">
        Заказы
      </a>

      <a href="#" data-page="analytics">
        Продажи
      </a>

      <a href="#" data-page="writeoff">
        Списание
      </a>

      <a href="#" data-page="settings">
        Настройки
      </a>

    </div>

  </div>

  <!-- Уведомление -->

  <div id="toast"></div>

  <script src="app.js"></script>

</body>
</html>
