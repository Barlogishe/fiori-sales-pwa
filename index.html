<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiori Silvestri</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1B2B34">
  <link rel="icon" href="icon-192.png">
</head>

<body>

<!-- Splash -->

<div id="splash">
  <div class="splash-content">
    <img src="icon-192.png" alt="Fiori Silvestri" class="logo">
  </div>
  <img src="flowers-bottom.png" alt=""class="splash-decoration">
</div>

<!-- App -->
<div id="app" class="hidden"></div>

<!-- Затемнение -->
<div id="overlay"></div>

<!-- Боковое меню -->

<div id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">Меню</div>
    <button class="drawer-close" onclick="closeMenu()">✕</button>
  </div>

  <div class="drawer-content">
    <a href="#" data-page="sale">Продажа</a>
    <a href="#" data-page="orders">Оформить заказ</a>
    <!--a href="#" data-page="analytics">Мои продажи</a>
    <a href="#" data-page="writeoff">Списание</a>
    <a href="#" data-page="settings">Настройки</a-->
    <a onclick="logout()">Выход</a>
  </div>

  <div class="drawer-footer">
    <div id="apiInfo" class="api-info">${apiStatus}</div>
  </div>
</div>
  
<!-- Уведомление -->
<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/masks.js"></script>
<script src="js/sale.js"></script>
<script src="js/order.js"></script>

<script src="app.js"></script>

</body>
</html>
